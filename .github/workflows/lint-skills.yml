name: Lint Skills

on:
  # 只新增「手动触发」入口，便于在不改 skills/ 的情况下验证三个 job；
  # 原有的 pull_request / push 两侧触发条件一字未改。
  workflow_dispatch:
  pull_request:
    paths:
      - 'skills/**'
      - 'registry/**'
  push:
    branches: [main]
    paths:
      - 'skills/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate skill structure
        run: |
          python - <<'PYEOF'
          import os, re, json, sys

          errors = []
          skills_dir = "skills"

          if not os.path.isdir(skills_dir):
              print("No skills/ directory found, skipping.")
              sys.exit(0)

          for name in sorted(os.listdir(skills_dir)):
              path = os.path.join(skills_dir, name)
              if not os.path.isdir(path) or name.startswith("_"):
                  continue

              skill_md = os.path.join(path, "SKILL.md")
              profile_md = os.path.join(path, "PROFILE.md")
              refs_dir = os.path.join(path, "references")

              # SKILL.md must exist
              if not os.path.isfile(skill_md):
                  errors.append(f"[{name}] Missing SKILL.md")
                  continue

              # Read and validate frontmatter
              with open(skill_md, "r", encoding="utf-8") as f:
                  content = f.read()

              fm_match = re.match(r"^---\n(.*?)\n---", content, re.DOTALL)
              if not fm_match:
                  errors.append(f"[{name}] SKILL.md missing frontmatter")
                  continue

              fm = fm_match.group(1)
              required_fields = ["name:", "description:", "agent_created:"]
              for field in required_fields:
                  if field not in fm:
                      errors.append(f"[{name}] frontmatter missing field: {field}")

              # name must match directory
              name_match = re.search(r"^name:\s*(.+)$", fm, re.MULTILINE)
              if name_match:
                  fm_name = name_match.group(1).strip()
                  if fm_name != name:
                      errors.append(f"[{name}] frontmatter name '{fm_name}' != directory '{name}'")

              # Check免责声明
              if "不声称代表" not in content and "不声称" not in content:
                  errors.append(f"[{name}] SKILL.md missing disclaimer (不声称代表本人)")

              # PROFILE.md must exist
              if not os.path.isfile(profile_md):
                  errors.append(f"[{name}] Missing PROFILE.md")

              # references/ must exist with 8 numbered files
              required_refs = [
                  "01-core-theories.md",
                  "02-analysis-frameworks.md",
                  "03-style-and-voice.md",
                  "04-key-views-timeline.md",
                  "05-publications.md",
                  "06-glossary.md",
                  "07-checklist.md",
                  "08-style-anti-patterns.md",
              ]
              if not os.path.isdir(refs_dir):
                  errors.append(f"[{name}] Missing references/ directory")
              else:
                  for ref_file in required_refs:
                      if not os.path.isfile(os.path.join(refs_dir, ref_file)):
                          errors.append(f"[{name}] Missing references/{ref_file}")

              # examples/INDEX.md recommended
              if not os.path.isfile(os.path.join(path, "examples", "INDEX.md")):
                  errors.append(f"[{name}] Missing examples/INDEX.md")

              # SKILL-condensed.md recommended (warn only)
              if not os.path.isfile(os.path.join(path, "SKILL-condensed.md")):
                  print(f"  WARN: [{name}] SKILL-condensed.md not found (recommended)")

              print(f"[OK] {name}")

          # Validate registry
          registry = "registry/index.json"
          if os.path.isfile(registry):
              try:
                  with open(registry, "r", encoding="utf-8") as f:
                      data = json.load(f)
                  skill_names = [s["name"] for s in data.get("skills", [])]
                  for name in sorted(os.listdir(skills_dir)):
                      if os.path.isdir(os.path.join(skills_dir, name)) and not name.startswith("_"):
                          if name not in skill_names:
                              errors.append(f"[{name}] not found in registry/index.json")
              except json.JSONDecodeError as e:
                  errors.append(f"registry/index.json is not valid JSON: {e}")

          if errors:
              print("\n=== VALIDATION ERRORS ===")
              for e in errors:
                  print(f"  ERROR: {e}")
              sys.exit(1)
          else:
              print("\nAll skills passed validation.")
          PYEOF

  # 新增 job：registry 漂移校验（不改动上方 lint job 及其触发条件）
  # 检查 registry/index.json、registry/roundtable-matrix.json 与 skills/ 三者是否同步，
  # 差异精确到「哪个 skill 的哪个字段」，实现见 scripts/check_registry.py。
  registry-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check registry drift
        run: python scripts/check_registry.py

  # 新增 job：按 SKILL_SPEC.md 做全量合规体检（不改动上方 job 及其触发条件）
  # 只在 ERROR 级（结构被破坏）时失败；WARN / INFO 为内容缺口，见脚本内严重度口径。
  spec-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit skills against SKILL_SPEC
        run: python scripts/audit_skills.py

  # 新增 job：strict 校验 SKILL.md 的 frontmatter 是合法 YAML。
  # 与上方 spec-audit 的关系：audit_skills.py 的 FM-07 在没有 PyYAML 的环境下只会降级为
  # 启发式检查；本 job 显式装 PyYAML，保证 CI 里做的是真正的 YAML 解析。
  # 背景：description 是 Agent 判断「要不要加载本技能」的触发字段，写坏了技能等于不存在，
  # 而原 lint job 只查字段名在不在（字符串级），从未解析过 YAML，所以 51 个非法文件一路绿灯。
  frontmatter-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate frontmatter parses as YAML
        run: |
          python - <<'PYEOF'
          import glob, re, sys, yaml

          files = sorted(glob.glob("skills/*/SKILL.md"))
          bad = []
          for f in files:
              text = open(f, encoding="utf-8").read().replace("\r\n", "\n")
              m = re.match(r"^---\n(.*?)\n---", text, re.DOTALL)
              if not m:
                  bad.append((f, "缺少 frontmatter"))
                  continue
              try:
                  data = yaml.safe_load(m.group(1))
              except Exception as e:
                  bad.append((f, str(e).strip().split("\n")[0]))
                  continue
              if not isinstance(data, dict):
                  bad.append((f, "frontmatter 顶层不是映射"))
              elif not data.get("name") or not data.get("description"):
                  bad.append((f, "缺少 name 或 description"))

          for f, why in bad:
              print("::error file=%s::%s" % (f, why))
          print("checked %d SKILL.md, invalid %d" % (len(files), len(bad)))
          sys.exit(1 if bad else 0)
          PYEOF

  # 新增 job：圆桌组阁回归。英文问题必须能召回，中文问题不得因英文通道而改变。
  # 背景：assemble.py 原本只做「中文标签 in 问题」的子串匹配，345 个标签里 330 个含中文，
  # 因此任何英文问题都命中 0 标签、恒定落到 3 个兜底专家——功能失效，不是效果差。
  roundtable-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assemble regression (EN recall + ZH no-regression)
        run: python scripts/check_roundtable_en.py

